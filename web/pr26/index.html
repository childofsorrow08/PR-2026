<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Поштові відправлення</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Поштові відправлення</h1>
        <label for="api-url">Адреса PostService</label>
        <input id="api-url" type="url" value="http://localhost:5000">
        <button id="refresh">Оновити</button>
        <p id="status" role="status"></p>
        <div class="table-wrap">
            <table>
                <thead id="table-header">
                    <tr>
                        <th scope="col" x-column="from">Відправник</th>
                        <th scope="col" x-column="to">Одержувач</th>
                        <th scope="col" x-column="content">Вміст</th>
                        <th scope="col" x-column="deliveryType">Тип доставки</th>
                        <th scope="col" x-column="weight">Вага, кг</th>
                        <th scope="col" x-column="width">Ширина, см</th>
                        <th scope="col" x-column="depth">Довжина, см</th>
                        <th scope="col" x-column="value">Оголошена вартість, грн</th>
                        <th scope="col" x-column="price">Ціна доставки, грн</th>
                    </tr>
                </thead>
                <tbody id="postings"></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
