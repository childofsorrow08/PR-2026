<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список поштових відправлень · PostService</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <strong>PostService</strong>
        <nav aria-label="Головна навігація">
            <a href="index.html">Головна</a>
            <a href="posting-list.html">Відправлення</a>
            <a href="about.html">Про програму</a>
        </nav>
    </header>
    <main>
        <h1 id="page-title">Список поштових відправлень</h1>
        <div class="toolbar">
            <a class="button" href="posting-edit.html">+ Нове відправлення</a>
            <button id="refresh" type="button">Оновити</button>
        </div>
        <p id="status" role="status"></p>
        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th scope="col" x-column="id">Номер</th>
                    <th scope="col" x-column="from">Відправник</th>
                    <th scope="col" x-column="to">Одержувач</th>
                    <th scope="col" x-column="content">Вміст</th>
                    <th scope="col" x-column="deliveryType">Доставка</th>
                    <th scope="col" x-column="weight">Вага, кг</th>
                    <th scope="col" x-column="price">Вартість, грн</th>
                    <th scope="col">Дії</th>
                </tr></thead>
                <tbody id="postings"></tbody>
            </table>
        </div>
    </main>
    <script src="scripts/api.js"></script>
    <script src="scripts/list.js"></script>
</body>
</html>
